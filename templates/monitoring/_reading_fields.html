{% if form.non_field_errors %}<div class="msg error">{{ form.non_field_errors }}</div>{% endif %}
<div class="form-grid">
  {% for field in form %}
  <div class="field">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="req">*</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<div class="hint">{{ field.help_text|safe }}</div>{% endif %}
    {% if field.errors %}<div class="err">{{ field.errors|striptags }}</div>{% endif %}
  </div>
  {% endfor %}
</div>
