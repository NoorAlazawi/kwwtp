{% comment %} g = dict: value, offset, color, text, label, status {% endcomment %}
<div class="gauge">
  <div class="ring">
    <svg width="104" height="104" viewBox="0 0 104 104">
      <circle cx="52" cy="52" r="44" fill="none" stroke="rgba(15,30,51,.08)" stroke-width="9"/>
      <circle cx="52" cy="52" r="44" fill="none" stroke="{{ g.color }}"
              stroke-width="9" stroke-linecap="round"
              stroke-dasharray="276.46" stroke-dashoffset="{{ g.offset }}"/>
    </svg>
    <div class="mid">
      <b class="num">{{ g.value|default:"—" }}</b>
      <s>/ 100</s>
    </div>
  </div>
  <div class="name">{{ g.label }}</div>
  <div class="st" style="color:{{ g.text }}">{{ g.status|default:"—" }}</div>
</div>
